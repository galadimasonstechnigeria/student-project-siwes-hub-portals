{% extends "base.html" %}
{% block title %}Students{% endblock %}

{% block content %}
<h2>Registered Students</h2>

<table>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Role</th>
    </tr>

    {% for s in students %}
    <tr>
        <td>{{ s.id }}</td>
        <td>{{ s.fullname }}</td>
        <td>{{ s.email }}</td>
        <td>{{ s.role }}</td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
